name: Update Cloudflare Best IPs

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync Cloudflare official IP ranges
        run: |
          mkdir -p ips
          curl -s https://www.cloudflare.com/ips-v4 -o ips/cloudflare-ips-v4.txt
          curl -s https://www.cloudflare.com/ips-v6 -o ips/cloudflare-ips-v6.txt

      - name: Download CloudflareSpeedTest
        run: |
          VERSION=$(curl -s https://api.github.com/repos/XIU2/CloudflareSpeedTest/releases/latest | grep '"tag_name"' | cut -d '"' -f 4)
          echo "CloudflareSpeedTest $VERSION"
          curl -sL "https://github.com/XIU2/CloudflareSpeedTest/releases/download/${VERSION}/CloudflareSpeedTest_linux_amd64.tar.gz" -o cfst.tar.gz
          tar -xzf cfst.tar.gz
          chmod +x CloudflareST

      - name: Speed test IPv4
        run: |
          ./CloudflareST -f ips/cloudflare-ips-v4.txt -o result.csv -n 200 -t 4 -p 10 || true
          ls -l result.csv || echo "no result.csv"

      - name: Parse results
        run: python3 scripts/parse_result.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ips/ result.csv
          git diff --cached --quiet || git commit -m "chore: update best IPs $(date -u +%Y-%m-%d)"
          git push
